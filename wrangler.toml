# Main app — Cloudflare WORKER via @opennextjs/cloudflare (migrated off the
# deprecated @cloudflare/next-on-pages Pages adapter, 2026-06-10). The Pages
# 25 MiB *uncompressed* Function cap was at the redline; Workers cap on
# *gzipped* size (~3.85 MiB here vs 10 MiB paid) gives real headroom.
name = "meetmeatthefair-app"
main = ".open-next/worker.js"
# OPE-994 — explicit, not the account default. The app is served only on
# meetmeatthefair.com/* (see [[routes]]); a *.workers.dev hostname would be a
# second front door outside every zone rule (the OPE-929 Cardworks incident).
# Top-level on purpose: a key placed after a [table] header belongs to that table.
workers_dev = false
# OPE-905 — bumped 2026-06-10 -> 2026-09-10.
compatibility_date = "2026-09-10"
# OPE-905 — so a production stack trace names our source, not the bundle.
upload_source_maps = true
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# OPE-905 — logs at full rate, traces sampled. Cloudflare's Workers Best
# Practices (2026-02) asks for both with an explicit head_sampling_rate rather
# than the bare `enabled = true` this file used to carry.
#
# logs 1.0 / traces 0.1 chosen deliberately: a log line is what you read during
# an incident and this Worker's volume makes 100% affordable, while traces are
# per-request spans whose value is statistical — 10% is enough to see a latency
# shape and cheap enough not to think about. If a specific investigation needs
# more, raise it for that investigation and put it back.
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# Smart Placement: run near the slow dependency (D1) rather than the user.
[placement]
mode = "smart"

[ai]
binding = "AI"

# Browser Rendering account id (non-secret); the token is a Worker secret
# CLOUDFLARE_BROWSER_RENDERING_TOKEN. Used by import-url/fetch escalation.
[vars]
# OPE-931 — "this is a deployed Worker". Read by isDeployedEnvironment() in
# src/lib/runtime-env.ts, which decides whether a MISSING binding fails closed.
#
# It replaces `!!env.CF_PAGES`, a Cloudflare PAGES variable that this app has
# not had since the 2026-06-10 OpenNext cutover — so two fail-closed branches
# had been evaluating false in production and would have failed OPEN instead.
#
# A plain [vars] line, deliberately: `wrangler deploy` replaces the whole block
# from this file on every deploy (OPE-284/OPE-509), so the committed value IS
# the live value and a dashboard edit cannot drift it. Local dev and tests have
# no Cloudflare env at all, so they read `false` and keep the dev-mode paths.
DEPLOY_ENV = "production"
CLOUDFLARE_ACCOUNT_ID = "e6011e48b7014ef83c77e3c767dac6cf"
# OPE-191 — flip to "true" to let the Monday vendor digest actually BROADCAST to
# the vendor list. While "false" the cron still runs every Monday: it composes
# the issue and persists it at /newsletter/<slug> for review, but mails nobody.
# That is the OPE-6 STOP-gate made structural rather than a note in a ticket.
# GO-LIVE 2026-08-10 (OPE-358) — John-authorized pilot. The vendor list is
# reconciled to exactly three addresses: john@pimboat.com, colors@symdak.com,
# jdcronin01@gmail.com. First live send Mon 2026-08-17 07:00 EDT.
VENDOR_DIGEST_SEND_ENABLED = "true"
# OPE-332 — relax `no-store` on anonymous public detail pages so conditional
# requests (304) can actually happen. GATED: this changes how every public page
# is served, so it ships OFF and only John flips it. Must live HERE, not in the
# dashboard — a dashboard [vars] override is silently wiped by the next deploy
# (OPE-284). While "false", validators are still emitted but the 304 path is
# largely inert, because a client told no-store has nothing to revalidate.
CONDITIONAL_GET_PUBLIC_CACHE = "false"
# OPE-738 — flip to "true" to serve /fair-entry-deadlines, the cross-event
# exhibitor & competition entry-deadline index, and to show its footer link.
# LIVE since 2026-09-02 — /fair-entry-deadlines is public.
# Shipped dark on 2026-09-01 (OPE-738) as a NEW customer-facing surface behind
# a STOP-gate; John approved publishing at issue level, then confirmed it
# directly in session on 2026-09-02, and this line is that approval.
# Reversal is this one line: set "false", deploy, and the route 404s with the
# footer link gone. No data is written and no mail sends either way.
# Must live HERE, not in the dashboard: a dashboard [vars] override is silently
# wiped by the next deploy (OPE-284/OPE-509) — which for an ON gate would mean
# the page quietly going dark again, so the committed value is the only value.
# `entry-deadlines-gate-ope738.test.ts` asserts this literal, so changing it
# stays a reviewed edit rather than a drive-by.
ENTRY_DEADLINES_INDEX = "true"
# CAL1 — serves the SSR Month calendar at /events?view=calendar
# (@jonnyboats/calendar-react). "false" = the legacy client calendar.
# ON PERMANENTLY since the 2026-06 prod verification: the SSR calendar is the
# shipped calendar (OPE-994, John 2026-09-14). Turning this off reverts
# /events?view=calendar to the legacy client calendar and disables CAL2 below.
CAL1_SSR_MONTH = "true"
# CAL2 — adds the Agenda + Year sub-views to the SSR calendar
# (?cal_view=agenda|year). Requires CAL1_SSR_MONTH = "true"; "false" = Month only.
# ON PERMANENTLY alongside CAL1 (OPE-994, John 2026-09-14).
CAL2_VIEWS = "true"
# OPE-163 — customer-facing reply send gate for the /admin/inbound-emails Reply
# panel. The endpoint refuses to enqueue unless this is "true"; the MCP consumer
# enforces the same flag as the authoritative hard stop.
#
# ON since 2026-08-30, on John's explicit instruction ("flip it to true in both
# files and ship it"). Must be "true" HERE and in mcp-server/wrangler.toml — the
# two Workers enforce it independently.
#
# ⚠️ OPE-648 — DO NOT flip this in the dashboard. `wrangler deploy` replaces
# `[vars]` WHOLESALE, so a dashboard edit survives only until the next deploy.
# The previous version of this comment recommended the dashboard, and that
# advice is what produced the "the flag flips without notice" reports logged
# since 2026-08-13: on 2026-08-30 a queue drain merged 11 PRs between 13:54Z and
# 15:27Z, and each deploy silently reverted the operator's flip. A reply was
# refused at 15:14Z for exactly that reason.
#
# This committed line is the source of truth. Change it here, deploy, and read
# the resolved runtime value at GET /api/admin/capability-flags.
EMAIL_REPLY_ENABLED = "true"
# OPE-412 — submission-received acknowledgment. OFF until John approves the
# copy (OPE-6 gate on new customer-facing templates). While off, a submission
# still succeeds and the skip is logged, so "we chose not to send" stays
# distinguishable from "we tried and failed".
SUBMISSION_ACK_ENABLED = "true"
# OPE-169 — newsletter BROADCAST gate. POST /api/admin/newsletter/send refuses a
# real broadcast to the subscriber list unless this is "true" (a single-address
# test_recipient send is always allowed).
#
# OPE-284 — ARMED. John authorized go-live 2026-07-23. Sending still requires his
# own click on the OPE-231 approve link; this flag only makes that click work.
#
# ⚠️ Do NOT "just override it in the dashboard" — a plain-text [vars] entry set in
# the dashboard is WIPED by the next `wrangler deploy`, which re-applies this file.
# That is exactly what happened here: the var was set in the dashboard ~07-13, the
# 2026-07-16 broadcast went out on it (6 recipients, ledgered), a later deploy
# silently reverted it to "false", and the 07-23 approve click hit "sending is
# turned off". This file is the only durable home for the flag. (Secrets survive a
# deploy; vars do not.)
#
# OPE-509 (2026-08-20) — mechanism decision, recorded here deliberately.
# KEPT as a committed plaintext var. REJECTED: making it a Cloudflare Secret.
# A secret would survive a deploy and so make a dashboard/CLI flip a real kill
# switch — but it also removes the value from `grep`, and "nobody can tell what
# this gate is set to" is the exact problem this ticket was filed to end. The
# flag is not the safety mechanism anyway: a broadcast additionally requires
# John's per-issue approve click (OPE-231) or an explicit MCP
# require_human_confirmation:'GO'. So the committed file stays the one source of
# truth, and the correct way to change this gate is to edit THIS LINE and deploy
# — not to touch the dashboard, where any edit is reverted by the next deploy.
# Read the resolved runtime value at GET /api/admin/capability-flags.
NEWSLETTER_SEND_ENABLED = "true"

# OPE-232 — CAN-SPAM physical postal address rendered in the newsletter footer.
# The digest HTML is rendered in THIS (main-app) worker via
# /api/admin/newsletter/send → newsletterDigestTemplate; MAILING_ADDRESS was only
# set on the MCP worker, so the main-app render fell back to a generic placeholder.
# Value matches the MCP worker's secret.
#
# ✅ CONFIRMED BY JOHN 2026-07-24 (OPE-284): "18 Main ST, Phillips, ME 04966" is
# the correct CAN-SPAM address. This supersedes the OPE-232 ticket prose, which
# said "20 Main Street" — that was the ticket being wrong, not the config. The
# question is settled; do not re-open it on the strength of the OPE-232 text.
MAILING_ADDRESS = "18 Main ST, Phillips, ME 04966"

[[d1_databases]]
binding = "DB"
database_name = "takemetothefair-db"
database_id = "d449e416-3814-48a6-b9e8-b676333b2cdc"
migrations_dir = "drizzle"

# OPE-904 / OPE-951 — the BURST half of the two-layer limiter John approved
# (option (c) for the eight abuse-prone policies): a HARD cap of 5 hits per key
# per 60 s, on top of the soft hourly KV quota.
#
# It is a Durable Object, not the Workers Rate Limiting binding this block used
# to declare. That binding (`BURST_LIMITER`, namespace 1001) returned success
# for every call in production — 7+ per colo inside one window, none refused —
# while refusing correctly in an isolated Worker; Cloudflare documents it as
# "permissive, eventually consistent … not an accurate accounting system".
#
# The class `BurstCounter` lives in the MCP Worker (mcp-server/src/burst-counter.ts,
# migration v2) and is bound here cross-script. The limit and window are code
# constants in src/lib/rate-limit.ts (BURST_LIMIT, BURST_WINDOW_SECONDS).
#
# ⚠️ DEPLOY ORDER: the MCP Worker must have deployed the class before this
# binding deploys, or this Worker's deploy fails on a missing class.
[[durable_objects.bindings]]
name = "BURST_COUNTER"
class_name = "BurstCounter"
script_name = "meetmeatthefair-mcp"

# OPE-899 — OpenNext's ISR revalidation queue (open-next.config.ts `doQueue`).
# `DOQueueHandler` is exported by OpenNext's own worker template; it dedupes
# revalidations of the same route and calls back into THIS Worker through
# `WORKER_SELF_REFERENCE` to regenerate. SQLite-backed (it persists a per-route
# sync table). Inert today — see open-next.config.ts for the measurement.
[[durable_objects.bindings]]
name = "NEXT_CACHE_DO_QUEUE"
class_name = "DOQueueHandler"

[[migrations]]
tag = "v1-ope899-isr-do-queue"
new_sqlite_classes = ["DOQueueHandler"]

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "meetmeatthefair-app"

# KV namespace for rate limiting
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "b7aeca316e7a41108fd375be2e152cff"

# R2 — vendor assets (Enhanced Profile logos/galleries), served at
# cdn.meetmeatthefair.com.
[[r2_buckets]]
binding = "VENDOR_ASSETS"
bucket_name = "mmatf-vendor-assets"

# R2 — OpenNext ISR incremental cache. open-next.config.ts wires
# r2IncrementalCache, which reads/writes rendered ISR output under the
# `NEXT_INC_CACHE_R2_BUCKET` binding (default prefix "incremental-cache").
# Bucket created 2026-06-10.
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "mmatf-isr-cache"

# Queue producers. On Workers these are FIRST-CLASS (unlike Pages, where they
# were a no-op and code fell back to the MCP HTTP proxy — see
# src/lib/queues/producers.ts; that fallback is now dead and can be removed in
# a follow-up). The MCP Worker remains the consumer (mcp-server/wrangler.toml).
[[queues.producers]]
binding = "EMAIL_JOBS"
queue = "email-jobs"

[[queues.producers]]
binding = "INDEXNOW_PINGS"
queue = "indexnow-pings"

[[queues.producers]]
binding = "EVENT_DISCREPANCIES"
queue = "event-discrepancies"

# SYN1 (2026-06-12) — syndication change triggers. Producer here (admin
# venue/event PATCH routes) + in the MCP Worker (update_* tools); consumer
# is the MCP Worker. Operator: `wrangler queues create syndication-changes`
# (+ a `syndication-changes-dlq` dead-letter) before first deploy.
[[queues.producers]]
binding = "SYNDICATION_CHANGES"
queue = "syndication-changes"

# ── Apex route ─────────────────────────────────────────────────────────────
# This Worker serves meetmeatthefair.com/* directly (cutover 2026-06-10). The
# old K2 apex-worker (meetmeatthefair-edge) that used to proxy + rewrite status
# was retired by this cutover and deleted (B5, 2026-06-12).
# NOTE: error/notFound() responses are soft-200 on ISR routes under
# @opennextjs/cloudflare — the status-rewrite did NOT become "moot via real
# 500s" as first assumed; it's an accepted soft-status + noindex tradeoff
# (docs/mig4-soft-404-opennext-isr.md).
# Rollback = re-point this hostname at the last pre-migration Pages deployment
# (see docs/opennext-cutover-runbook.md).
[[routes]]
pattern = "meetmeatthefair.com/*"
zone_name = "meetmeatthefair.com"

# Workflows can now be bound directly (Pages couldn't) — optional follow-up
# cleanup to drop the MCP HTTP-proxy indirection for schema-org-sync etc.
