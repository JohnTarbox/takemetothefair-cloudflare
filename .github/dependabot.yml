# OPE-908 — dependency update automation.
#
# Dependabot rather than Renovate, deliberately: Renovate needs a GitHub App
# installed on the account, which is a repo-owner action nobody can take from a
# PR. Dependabot is native, so this committed file IS the whole setup — no
# out-of-band step that can be forgotten and leave the config inert.
#
# The motivating case: OPE-896 shipped `next` 15.5.19 carrying an unauthenticated
# RCE (GHSA-2xp9-vwfh-vxw4, fixed in 15.5.24) and `next-auth` beta.30 carrying an
# auth-checks-fail-open critical. Both fixes had been published for a while.
# Nothing was watching, so nothing said so.
#
# ⚠️ SECURITY updates are a REPO SETTING, not this file. Dependabot only raises
# security PRs when "Dependabot alerts" and "Dependabot security updates" are
# enabled in Settings → Code security. This file governs the *version* updates
# below. See the ticket comment for the measured state of those settings.
version: 2

# OPE-1385 (DEP-7) — the private `@johntarbox/*` scope lives on GitHub Packages
# (see .npmrc: `@johntarbox:registry=https://npm.pkg.github.com`). Without this
# block Dependabot cannot authenticate to it, so a manifest that names
# `@johntarbox/calendar-grid` fails to resolve and the WHOLE npm update run
# errors — not just that one package.
#
# ⚠️ The secret is a DEPENDABOT secret (Settings → Secrets and variables →
# Dependabot), not an Actions secret — Dependabot cannot read Actions secrets,
# and the Actions-side `GITHUB_TOKEN` that CI uses for NODE_AUTH_TOKEN does not
# exist in a Dependabot run. It must be a token with `read:packages` on the
# @johntarbox packages. Until it exists, this registry fails to authenticate
# exactly as it does today.
registries:
  github-packages-johntarbox:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.DEPENDABOT_GH_PACKAGES_TOKEN}}

updates:
  # ---- npm -------------------------------------------------------------
  # Grouped so a week's patches arrive as a few reviewable PRs rather than
  # thirty. Ungrouped Dependabot is the classic way to get a bot everybody
  # learns to ignore, which is the same failure as having no bot.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 8
    versioning-strategy: "increase"
    # OPE-1385 — lets the npm run authenticate to the @johntarbox scope above.
    registries:
      - github-packages-johntarbox
    groups:
      # The runtime the site actually serves on. Kept separate because these
      # are the ones worth reading carefully.
      #
      # OPE-1372 — every named group is split into a minor/patch half and a
      # major half. Unsplit, a group's patches rode in the same PR as its
      # breaking majors, so safe patches waited on a migration: #1232
      # (react 18→19) sat open 35 days and #1433 (drizzle 0.45.2→0.45.4, a
      # patch) 17 days.
      # Dependabot assigns an update to the FIRST group whose rules match. The
      # minor/patch half declines a major through update-types, so the major
      # falls to the half directly below it. Each pair must therefore keep
      # IDENTICAL patterns; no YAML anchors are used, so keep the two lists in
      # step by hand. These groups set no `applies-to`, so they default to
      # version updates only and security updates are unaffected.
      cloudflare-runtime-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "@opennextjs/*"
          - "wrangler"
          - "@cloudflare/*"
          - "miniflare"
      cloudflare-runtime-major:
        update-types:
          - "major"
        patterns:
          - "@opennextjs/*"
          - "wrangler"
          - "@cloudflare/*"
          - "miniflare"
      next-and-auth-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "next"
          - "next-auth"
          - "@auth/*"
          - "react"
          - "react-dom"
          - "@types/react*"
      next-and-auth-major:
        update-types:
          - "major"
        patterns:
          - "next"
          - "next-auth"
          - "@auth/*"
          - "react"
          - "react-dom"
          - "@types/react*"
      database-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      database-major:
        update-types:
          - "major"
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      # Everything else, split by risk rather than by name.
      dev-tooling:
        dependency-type: "development"
        patterns:
          - "*"
        exclude-patterns:
          - "@opennextjs/*"
          - "wrangler"
          - "@cloudflare/*"
          - "next*"
          - "drizzle*"
      production-minor-and-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
        exclude-patterns:
          - "@opennextjs/*"
          - "wrangler"
          - "@cloudflare/*"
          - "next*"
          - "@auth/*"
          - "react*"
          - "drizzle*"
      # OPE-992 — production MAJOR updates get their own group, kept apart from
      # minor/patch on purpose: a breaking major must not hold the safe patches
      # in the group above hostage while it waits for a migration.
      #
      # ORDER MATTERS. Dependabot assigns each update to the FIRST group (top to
      # bottom) whose rules match, so this group only ever sees what nothing
      # above claimed:
      #   - the cloudflare-runtime / next-and-auth / database pairs together
      #     cover every update type (OPE-1372 split each into minor-and-patch
      #     + major), so their packages' majors (e.g. next 15→16) land in the
      #     named *-major group and never reach this one;
      #   - dev-tooling already takes every development major;
      #   - production-minor-and-patch filters to minor/patch, so a production
      #     major falls through it to here.
      # Keep this group LAST, and keep its exclude-patterns identical to the one
      # above, or it will start swallowing packages the named groups own.
      #
      # Measured before this change: ungrouped production majors were already
      # raised, one PR per package (#1236 postal-mime 2→3, #1237 lucide-react
      # 0→1, #1239 @next/third-parties 15→16), each spending a slot of
      # open-pull-requests-limit. This group makes them one reviewable PR.
      production-major:
        dependency-type: "production"
        update-types:
          - "major"
        patterns:
          - "*"
        exclude-patterns:
          - "@opennextjs/*"
          - "wrangler"
          - "@cloudflare/*"
          - "next*"
          - "@auth/*"
          - "react*"
          - "drizzle*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"

  # ---- GitHub Actions --------------------------------------------------
  # Every `uses:` in .github/workflows is pinned to a 40-character SHA (OPE-908),
  # enforced in CI by scripts/check-workflow-action-pins.ts. Dependabot
  # understands SHA pins and bumps the SHA *and* the trailing `# vX.Y.Z`
  # comment together, so pinning does not mean going stale — which is the
  # usual objection to pinning.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 4
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
