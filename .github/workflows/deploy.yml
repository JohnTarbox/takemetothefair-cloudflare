name: Deploy to Cloudflare

# OPE-901 — the deploy is GATED ON CI. It used to trigger on `push: main`,
# independently of ci.yml, so both ran in parallel and the deploy never looked
# at the test result: a red commit on main applied D1 migrations to production
# and shipped. `main` carries no branch protection either (verified 2026-09-10:
# the branch-protection API returns 404 "Branch not protected"), so nothing
# upstream was enforcing green merges — the only thing standing between a
# failing test and production was whoever pressed merge.
#
# `workflow_run` fires after CI *completes*; the `gate` job below decides whether
# this run may deploy (OPE-934 — a green PUSH to main in THIS repository, still
# main's HEAD; or a manual dispatch on main). d1-migrate needs the gate, and
# deploy-worker / deploy-mcp-server need d1-migrate, so a skip stops all three.
#
# ⚠️ Every checkout in this file must use the triggering run's head SHA. A
# `workflow_run` event checks out the default branch by default, which is the
# right content only by coincidence and the wrong content the moment two
# commits land close together.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this production deploy is being run by hand (bypasses the CI gate)"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

# OPE-908 — deny by default; each job below declares exactly what it needs.
permissions: {}

jobs:
  # OPE-934 — who may reach production, decided by a TESTED script rather than a
  # job-level `if:`. The old gate admitted any successful CI run whose head
  # branch was named `main` — including a fork PR's, on a public repository —
  # and then checked out and deployed that commit. See scripts/deploy-gate.mjs
  # for every rule and src/lib/__tests__/deploy-gate-ope934.test.ts for proof.
  #
  # This job checks out MAIN, never the triggering commit: the gate's own code
  # must not come from the thing it is judging. Every later checkout uses the
  # SHA it emits, so all jobs build one commit.
  gate:
    name: Deploy gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Checkout main (trusted gate code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Resolve main's current HEAD
        id: head
        # `origin` carries the checkout's token, so this keeps working if the repo is
        # ever made private. An empty result makes the gate SKIP, never deploy.
        run: echo "sha=$(git ls-remote origin refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      # Only consulted when the triggering run is STALE (see deploy-gate.mjs):
      # the conclusion of the push-to-main CI run for main's HEAD, if one exists.
      - name: Main HEAD's CI conclusion
        id: headci
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          c=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&branch=main" --jq '.workflow_runs[0].conclusion // ""' 2>/dev/null || true)
          echo "conclusion=${c}" >> "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        run: node scripts/deploy-gate.mjs
        env:
          MAIN_HEAD_SHA: ${{ steps.head.outputs.sha }}
          MAIN_HEAD_CI_CONCLUSION: ${{ steps.headci.outputs.conclusion }}

  # D1 migrations must apply BEFORE either the Pages or MCP Worker deploy
  # so the new code never runs against an old schema. Added 2026-05-21
  # after PR-D's drizzle/0084 collision incident — three migrations
  # (0082/0083/0084) had been merged but never applied because this
  # workflow had no migration step at all.
  #
  # Idempotent: `wrangler d1 migrations apply` skips any migration whose
  # filename is already recorded in d1_migrations. Safe to re-run on every
  # push to main, even when no migration files changed.
  d1-migrate:
    name: Apply D1 migrations
    # OPE-901 — the gate. A manual run is a deliberate act and carries a reason;
    # an automatic run must be a SUCCESSFUL CI run. Anything else (failure,
    # cancelled, timed_out, skipped) falls through to no deploy, which is the
    # safe direction for a mistake in this expression to fail in.
    needs: gate
    if: needs.gate.outputs.decision == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # OPE-934 — the SHA the gate approved (a green push-to-main run that is
          # still main's HEAD, or main's HEAD on a manual dispatch from main).
          ref: ${{ needs.gate.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@johntarbox"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply D1 migrations
        # wrangler d1 migrations apply doesn't accept --yes — its help text
        # says the confirmation step is auto-skipped in CI/CD environments.
        # PR-F shipped with `-- --yes` and failed the first deploy run with
        # "Unknown argument: yes" (run 26233584752, 2026-05-21).
        run: npm run db:migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # OpenNext migration (2026-06-10): replaces the former `deploy-pages` job.
  # Builds with @opennextjs/cloudflare and deploys the Worker, which serves the
  # apex route directly (wrangler.toml [[routes]]). The old K2 apex-worker that
  # used to front Pages was retired by the cutover and deleted (B5, 2026-06-12).
  # Rollback target = the Pages project's last pre-migration deployment
  # (next-on-pages and @opennextjs/cloudflare can't coexist, so the Pages build
  # can't run from this branch) — see docs/opennext-cutover-runbook.md.
  deploy-worker:
    needs: [gate, d1-migrate]
    name: Build & Deploy Main App (Worker / OpenNext)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # OPE-934 — the SHA the gate approved (a green push-to-main run that is
          # still main's HEAD, or main's HEAD on a manual dispatch from main).
          ref: ${{ needs.gate.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@johntarbox"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* are inlined at build time (Next.js). Same GitHub-secrets
      # source as the former Pages build (see git history for the 2026-04-27
      # GA4-outage lesson).
      - name: Build with OpenNext adapter
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ secrets.NEXT_PUBLIC_CF_BEACON_TOKEN }}
          # OPE-150 — the register-page Cloudflare Turnstile sitekey. Public
          # (inlined into the client bundle) but MUST be present at build or the
          # widget never mounts and /api/auth/register dead-ends every signup on
          # "complete the security check". Requires the GitHub repo secret
          # NEXT_PUBLIC_TURNSTILE_SITE_KEY to be set (an empty/missing secret
          # inlines blank — same broken state, so also guarded client-side).
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      # ── OPE-494 — keep the PREVIOUS build's chunks servable after a deploy ──
      #
      # The Workers Assets manifest is replaced wholesale on every deploy, so the
      # moment a new version goes live the old build's `_next/static/chunks/*`
      # stop being served and any tab still holding the old manifest throws
      # ChunkLoadError on its next client-side navigation. 60 occurrences across
      # 49 routes in 14 days, and this repo deploys several times a day.
      #
      # The ticket proposed moving _next/static to R2 and pointing Next at it with
      # `assetPrefix`. This does the same job by merging the previous build's tree
      # into the new one before upload, which is strictly safer: `assetPrefix` is
      # baked in at BUILD time, so a wrong value breaks every page's JS at once,
      # and it needs a new bucket, a CDN route and a lifecycle rule. This needs
      # none of those, and its failure mode is today's behaviour.
      #
      # Safe to merge because the filenames are content-addressed — chunks are
      # `<id>-<contenthash>.js` and the manifests live under a per-build ID
      # directory (`_next/static/<buildId>/`). Two builds cannot collide on a name
      # unless the file is byte-identical.
      #
      # The merge copies PREVIOUS first and CURRENT second, so on any collision
      # the current build wins by copy order. Deliberately not `cp -n`: GNU
      # coreutils warns that `-n` is "non-portable and may change in future", and
      # a silent flip in that behaviour would mean the OLD build overwriting the
      # new one — a far worse failure than the one being fixed, and an invisible
      # one. Copy order cannot change meaning.
      #
      # Bounded at two generations by construction: the cache is re-saved from a
      # snapshot taken BEFORE the merge, so it always holds exactly one build, not
      # an ever-growing union. Measured 2026-08-25 — one build is 389 files /
      # 5.7 MB, so two is ~780 against the 20,000-file Workers Assets limit. The
      # guard below fails the deploy long before that stops being true.
      - name: Snapshot this build's static tree (pre-merge)
        run: |
          set -eu
          rm -rf /tmp/next-static-current
          mkdir -p /tmp/next-static-current
          cp -R .open-next/assets/_next/static/. /tmp/next-static-current/
          echo "this build: $(find /tmp/next-static-current -type f | wc -l) files"

      - name: Restore previous build's static tree
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/next-static-previous
          # Unique per commit so the save below is never a no-op on an existing
          # key; the prefix restore-key is what actually finds the last build.
          key: next-static-${{ github.sha }}
          restore-keys: |
            next-static-

      - name: Merge previous build's chunks into this deploy
        run: |
          set -eu
          rm -rf /tmp/next-static-merged
          mkdir -p /tmp/next-static-merged
          if [ -d /tmp/next-static-previous ]; then
            cp -R /tmp/next-static-previous/. /tmp/next-static-merged/
            echo "merged previous build's static tree"
          else
            echo "no previous static tree cached (first run after this change) — deploying this build only"
          fi
          # Current build copied SECOND, so it wins any collision.
          cp -R .open-next/assets/_next/static/. /tmp/next-static-merged/
          rm -rf .open-next/assets/_next/static
          mv /tmp/next-static-merged .open-next/assets/_next/static
          count=$(find .open-next/assets -type f | wc -l)
          echo "asset files after merge: ${count} (Workers Assets limit: 20000)"
          if [ "${count}" -gt 15000 ]; then
            echo "::error::asset count ${count} is approaching the 20000 Workers Assets limit — reduce retained generations"
            exit 1
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # Advance the generation only after a successful deploy: if the deploy
      # failed, the build now live is still the one already cached, so leaving the
      # old entry in place is correct. Saved from the PRE-MERGE snapshot, which is
      # what bounds retention at two builds.
      - name: Stage this build's static tree for the next deploy
        if: success()
        run: |
          set -eu
          rm -rf /tmp/next-static-previous
          mkdir -p /tmp/next-static-previous
          cp -R /tmp/next-static-current/. /tmp/next-static-previous/

      - name: Save this build's static tree
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/next-static-previous
          key: next-static-${{ github.sha }}

      # Post-deploy prod smoke — the OpenNext Worker now serves the apex route
      # (cutover 2026-06-10). Hardcoded URLs only, no user input into the shell.
      - name: Wait for prod propagation
        run: sleep 30
      - name: Post-deploy smoke test
        run: |
          set -eu
          echo "Smoke: /events renders event links"
          curl -fsS 'https://meetmeatthefair.com/events' -o /tmp/smoke-events.html
          if ! grep -qE 'href="/events/[a-z0-9-]+"' /tmp/smoke-events.html; then
            echo "FAIL: /events rendered no event links"; head -c 2000 /tmp/smoke-events.html; exit 1
          fi
          echo "Smoke: known-good venue returns content, not the error UI"
          curl -fsS 'https://meetmeatthefair.com/venues/abbot-square' -o /tmp/smoke-venue.html
          if grep -q 'Service temporarily unavailable' /tmp/smoke-venue.html; then
            echo "FAIL: /venues/abbot-square rendered the error UI"; head -c 2000 /tmp/smoke-venue.html; exit 1
          fi
          echo "Smoke passed."

  deploy-mcp-server:
    needs: [gate, d1-migrate]
    name: Build & Deploy MCP Server (Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # OPE-934 — the SHA the gate approved (a green push-to-main run that is
          # still main's HEAD, or main's HEAD on a manual dispatch from main).
          ref: ${{ needs.gate.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@johntarbox"

      - name: Install dependencies (workspace-aware, runs from root)
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # OPE-934 — the SHA the gate approved and this job checked out, so /version
      # names what actually shipped. (`github.sha` on a workflow_run is main's
      # HEAD when the EVENT fired, which is not guaranteed to be the commit built.)
      # github.run_started_at is the workflow start in ISO 8601. Routed through
      # env vars to avoid embedding ${{ }} expressions inside shell command bodies.
      - name: Compute build vars
        id: vars
        env:
          FULL_SHA: ${{ needs.gate.outputs.sha }}
          RUN_STARTED: ${{ github.run_started_at }}
        run: |
          echo "git_sha=${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "build_time=$RUN_STARTED" >> "$GITHUB_OUTPUT"

      - name: Deploy MCP Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mcp-server
          command: deploy --var GIT_SHA:${{ steps.vars.outputs.git_sha }} --var BUILD_TIME:${{ steps.vars.outputs.build_time }}
