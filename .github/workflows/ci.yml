name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@johntarbox"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Run unit tests
        run: npm test -- --run

      - name: Run unit tests with coverage
        run: npm run test:coverage -- --run

      # OPE-261 — the root vitest config only includes `src/**`, and no workflow
      # ran the workspace packages, so all 18 test files under `packages/*`
      # (14 in @takemetothefair/utils alone: recurrence, event-dates, venue-name,
      # source-tier, …) had never executed in CI. They pass — but nothing was
      # checking, which is the same "green means nothing was measured" shape
      # this ticket exists to fix on the alerting side.
      - name: Run workspace package tests (packages/*)
        run: npm test --workspaces --if-present

  test-mcp-server:
    name: MCP Server Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@johntarbox"

      - name: Install dependencies (workspace-aware, runs from root)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Run MCP server tests
        run: npm test --workspace mcp-server

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@johntarbox"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Typecheck (app + packages + mcp-server)
        run: npm run typecheck:all

      - name: Guard against edge runtime decls (forbidden under OpenNext)
        run: npx tsx scripts/check-no-edge-runtime.ts

      - name: Guard that every outbound email send is ledgered (OPE-319)
        run: npx tsx scripts/check-email-sends-ledgered.ts

      - name: Guard that view counters bypass Drizzle (OPE-332)
        run: npx tsx scripts/check-view-counters-raw-sql.ts

      - name: Check D1 100-column join cap
        run: npx tsx scripts/check-d1-100col-joins.ts

      - name: Check D1 100-bound-param cap (OPE-241 — unbounded inArray lists)
        run: npx tsx scripts/check-d1-inarray-params.ts

      - name: Check events inserts state their confidence (OPE-433)
        run: npx tsx scripts/check-events-insert-confidence.ts

      - name: Check venue/event_day writes are auditable (OPE-433 scope 5)
        run: npx tsx scripts/check-venue-day-writes-audited.ts

      - name: Check Turnstile render params (OPE-250 — size enum + sitekey)
        run: npx tsx scripts/check-turnstile-params.ts

      - name: Check event JSON-LD required fields (A10 — guards K46 'Missing field location')
        run: npx tsx scripts/check-event-jsonld-fields.ts

      - name: Check /_next/static keeps its immutable cache header (OPE-476)
        run: npx tsx scripts/check-static-asset-cache.ts

      - name: Check MCP tools are registered on BOTH transports (OPE-469)
        run: npx tsx scripts/check-mcp-tools-both-paths.ts

      - name: Guard against LIKE patterns built from user input (OPE-565)
        run: npx tsx scripts/check-d1-like-user-input.ts

      - name: Guard against Web APIs above the browser support floor (OPE-640)
        run: npx tsx scripts/check-browser-api-floor.ts

      - name: Guard against direct gtag() call sites (OPE-392)
        run: npx tsx scripts/check-gtag-call-sites.ts

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@johntarbox"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Initialize D1 database
        run: npx wrangler d1 migrations apply takemetothefair-db --local

      - name: Seed database
        run: npx tsx scripts/seed.ts

      # OPE-484 — key the browser cache on the RESOLVED Playwright version, read
      # from node_modules after `npm ci`. package.json pins `^1.40.0`, which
      # resolves to 1.58.0 today and will drift on its own; keying on the range
      # would serve a stale browser build after a minor bump, and keying on the
      # lockfile hash would needlessly miss on every unrelated dependency change.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The cache key names the BROWSER SET, not just the version. E2E needs
      # chromium+webkit and Smoke needs chromium only; if they shared a key, a
      # Smoke-populated entry would register as a hit for E2E and webkit would
      # simply be absent — a missing-browser failure at test time rather than an
      # honest cache miss. Two entries, no cross-contamination.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium-webkit

      # OPE-361 — webkit as well as chromium. The /register mobile-layout bug was
      # reported on an iPhone and desktop-width Chromium testing could not see
      # it; the mobile-safari project (iPhone 13 profile) is what covers that
      # class now, and a project CI never runs is not coverage.
      #
      # OPE-484 — the download is the step that intermittently sat for 20-30
      # minutes (once 80, while a sibling PR's identical job finished in 3m35s).
      # `timeout-minutes` is the half of this fix that matters most: a hang now
      # FAILS instead of showing "pending", which a reviewer cannot distinguish
      # from a queue. That ambiguity is what pressured merges onto incomplete
      # gates.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium webkit

      # On a cache hit the BINARIES are restored but the apt system libraries are
      # not — those live in the runner image, not in ~/.cache/ms-playwright, and
      # webkit in particular needs several that ubuntu-latest does not preinstall.
      # So a hit still runs deps-only, which is the cheap half of `--with-deps`.
      #
      # OPE-705 — the timeout is 10, not 5, and the number is measured rather
      # than picked. Across 20 samples of this step on SUCCESSFUL runs
      # (2026-08-31, `actions/runs/<id>/jobs`):
      #
      #     min 12s · median ~25s · mean 53s · max 275s
      #     7 of 20 exceeded 60s
      #
      # The old limit was 300s, so the slowest run that PASSED did so with 25
      # seconds to spare — an 8% margin on a step whose spread is 20x. It read
      # as a rare flake (0 of the last 100 CI runs failed on it) only because it
      # was squeaking under, not because the tail is unlikely. The cost is paid
      # by a step that is normally 25s: a timeout raise costs nothing on the
      # median path and only spends the extra minutes on the days apt is slow.
      #
      # 10 matches the sibling browsers step above. Do NOT tighten this back
      # toward the observed maximum — `__tests__/ci-playwright-timeouts.test.ts`
      # fails if either Playwright step drops below 10, precisely because
      # "5 minutes is plenty for a 25-second step" is the reasoning that set it
      # there the first time.
      - name: Install Playwright system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: npx playwright install-deps chromium webkit

      # mobile-safari is testMatch-scoped to *-mobile-*.spec.ts, so this adds
      # ~8 tests rather than a fourth full pass of the suite.
      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium --project=mobile-safari
        env:
          CI: true
          AUTH_SECRET: ci-test-secret-at-least-32-characters-long
          NEXTAUTH_SECRET: ci-test-secret-at-least-32-characters-long
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@johntarbox"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      # OPE-484 — same treatment as the E2E job. Smoke needs chromium only, so it
      # carries its own cache key; see the note there for why the browser set is
      # part of the key rather than shared.
      #
      # The two jobs cannot literally share one install — they are separate jobs
      # on separate runners. What they were actually competing for was the
      # upstream CDN, which is why they hung simultaneously; a warm cache removes
      # both from that path entirely, which is the shareable part.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      # OPE-705 — same raise as the E2E job's step; see the measurement recorded
      # there. Smoke installs chromium deps only and its own samples are milder
      # (12-87s over the same 20-run window), but it hits the SAME apt mirror on
      # the same runners, so leaving it at 5 would be fixing one of two identical
      # paths — this repo's most-repeated defect shape.
      - name: Install Playwright system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: npx playwright install-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: smoke-test-report
          path: playwright-report/
          retention-days: 7
