name: Production Verification

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday 6 AM UTC
  workflow_dispatch:

jobs:
  verify:
    name: Verify Production Site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # OPE-363 — this step ran with `continue-on-error: true`, so the
      # workflow could never go red and nobody read the report. It had been
      # reporting 5 failures every Monday: three false alarms from a
      # `networkidle` wait that never settles on this site, one assertion that
      # had been stale since the 2026-06-07 design-system token migration, and
      # ONE REAL DEFECT (state-page pagination). All four false/stale cases are
      # fixed in this change, so a red run now means something.
      #
      # ⚠️ The first scheduled run WILL be red, on the real one — clicking the
      # next-page control on /events/[state] does not navigate. That is the
      # check working, not the check being noisy; suppressing a true alarm in
      # code is worse than a red badge. See the OPE-363 thread for the
      # diagnosis.
      - name: Run production verification
        run: npx tsx scripts/verify-production.ts

      - name: Upload screenshots and results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: production-verification
          path: |
            test-results/
            playwright-report/
          retention-days: 14
